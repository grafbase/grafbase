name: Gateway Helm Chart

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # Required for WIF OIDC token exchange in auth-gar

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  # Pantheon GCP Artifact Registry helm repo. Override via HELM_REGISTRY_REPOSITORY.
  REGISTRY_REPOSITORY: ${{ vars.HELM_REGISTRY_REPOSITORY || 'us-docker.pkg.dev/pantheon-artifacts/helm-internal' }}
  CHART_PATH: gateway/helm

jobs:
  detect-change-type:
    runs-on: sbx-pan-base
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            build:
              - gateway/helm

  gateway-helm-release:
    name: Build gateway helm chart
    runs-on: sbx-pan-base
    needs: [detect-change-type]
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4.3.1
        with:
          version: 'v3.16.2'

      - name: Authenticate to Google Artifact Registry
        uses: pantheon-systems/common-gh/auth-gar@91222b8009f6df264fee51dce8a7d266a84eecbc # main 2025-11-28T13:02:03Z

      - name: Publish gateway helm chart
        shell: bash
        run: |
          echo "Building helm chart"
          CHART_VER=$(helm show chart ${{ env.CHART_PATH }} | grep "^version:" | gawk '{print $2}')
          helm package ${{ env.CHART_PATH }}
          helm push gateway-$CHART_VER.tgz oci://${{ env.REGISTRY_REPOSITORY }} --debug
